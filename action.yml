name: Setup-Oracle-Test-Pilot

description: 'Setup Test Pilot helps integrating Oracle Test Pilot for Third-Party Software within your GitHub Action workflows.'

branding:
  icon: 'check-circle'
  color: 'green'

inputs:
  version:
    description: 'The version to use.'
    default: 'v1.0.30'
    required: true
  action:
    description: 'The action to run (create*, delete, skip-testing).'
    default: 'create'
    required: true
  oci-service:
    description: 'The Oracle Cloud Infrastructure service to test.'
    default: 'autonomous-transaction-processing-serverless-26ai'
    required: true
  user:
    description: 'The database username to be used for database creation. If multiple users (up to 10) are required then enter a comma-separated list of usernames (no space). Limit usernames to 118 chars maximum. Accepted chars are: upper case letters, lower case letters, digits, colon, hyphen, underscore, and dot.'
    required: false
  connection-string-format:
    description: 'The resulting connection string format (easy-connect*, tns).'
    default: 'easy-connect'
    required: false
  surround-connection-string-with-double-quotes:
    description: 'If the connection string must be surrounded by double quotes (false*, true).'
    default: 'false'
    required: false
  prefix_list:
    description: 'A comma separated list of file(s) or folder(s) that if changed should not trigger any test (example: folder containing documentation).'
    required: false
  github-token:
    description: 'The GitHub token to use.'
    default: ''
    required: false
  target-repository:
    description: 'The target repository for registration token creation.'
    default: ''
    required: false

outputs:
  database_protocol:
    description: 'The protocol to access the database.'
    value: ${{ steps.create.outputs.database_protocol }}
  database_host:
    description: 'The database hostname.'
    value: ${{ steps.create.outputs.database_host }}
  database_port:
    description: 'The database port.'
    value: ${{ steps.create.outputs.database_port }}
  database_service:
    description: 'The database service name.'
    value: ${{ steps.create.outputs.database_service }}
  database_user:
    description: 'The database user. If several are provided, then this will be a list of comma-separated users.'
    value: ${{ steps.create.outputs.database_user }}
  database_password:
    description: 'The database password.'
    value: ${{ steps.create.outputs.database_password }}
  database_version:
    description: 'The database version.'
    value: ${{ steps.create.outputs.database_version }}
  connection_string_suffix:
    description: 'The database connection string suffix (after @).'
    value: ${{ steps.create.outputs.connection_string_suffix }}
  skip_tests:
    description: 'Should skip tests?'
    value: ${{ steps.analyze_commits.outputs.skip_tests }}

runs:
  using: 'composite'
  steps:
    - name: 'Install binaries'
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: ${GITHUB_ACTION_PATH}/setup-testpilot.sh

    - name: 'Analyze commits'
      id: analyze_commits
      if: inputs.action == 'skip-testing'
      shell: bash -leo pipefail {0}
      env:
        RUNID: ${{ github.run_number }}
      run: |
        ${GITHUB_ACTION_PATH}/setup-testpilot --skip-testing \
        --owner "${{ github.repository_owner }}" --repository "${{ github.event.repository.name }}" --pull-request-number "${{ github.event.pull_request.number }}" \
        --prefix-list "${{ inputs.prefix_list }}"

    - name: 'Create'
      id: create
      if: inputs.action == 'create'
      shell: bash -leo pipefail {0}
      env:
        RUNID: ${{ github.run_number }}
        JOBID: ${{ job.check_run_id }}
      run: |
        ${GITHUB_ACTION_PATH}/setup-testpilot --create \
        --user "${{ inputs.user }}" --oci-service "${{ inputs.oci-service }}" \
        --connection-string-format "${{ inputs.connection-string-format }}" \
        --surround-connection-string-with-double-quotes "${{ inputs.surround-connection-string-with-double-quotes }}"

    - name: 'Delete'
      id: delete
      if: inputs.action == 'delete'
      shell: bash -leo pipefail {0}
      env:
        RUNID: ${{ github.run_number }}
        JOBID: ${{ job.check_run_id }}
      run: |
        ${GITHUB_ACTION_PATH}/setup-testpilot --delete \
        --user "${{ inputs.user }}" --oci-service "${{ inputs.oci-service }}" \
        --connection-string-format "${{ inputs.connection-string-format }}" \
        --surround-connection-string-with-double-quotes "${{ inputs.surround-connection-string-with-double-quotes }}"

    - name: 'Create registration token'
      id: create_registration_token
      if: inputs.action == 'create-registration-token'
      shell: bash -leo pipefail {0}
      env:
        RUNID: ${{ github.run_number }}
      run: |
        ${GITHUB_ACTION_PATH}/setup-testpilot --create-registration-token \
        --owner "${{ github.repository_owner }}" \
        --repository "${{ inputs.target-repository || github.event.repository.name }}" \
        --owner-type "${{ github.event.repository.owner.type }}" \
        --github-token "${{ inputs.github-token }}" 
